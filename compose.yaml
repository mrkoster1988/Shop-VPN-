services:
  shop:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    # Linux host network lets the shop reach a local panel and WG agent via loopback.
    network_mode: host
    volumes:
      - shop_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request, urllib.parse; urllib.request.urlopen('http://127.0.0.1:8000'+urllib.parse.urlsplit(os.environ['PUBLIC_URL']).path.rstrip('/')+'/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
volumes:
  shop_data:
