name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  panel-wizard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/panel-ui" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/panel-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check panel wizard, credentials and updates on desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/panel-ui/node_modules
          PANEL_UI_OUTPUT: ${{ runner.temp }}/panel-ui-screenshots
          HOST_UI_LOG_PREVIEWS: '1'
        run: |
          node tests/panel_wizard_browser.cjs
          node tests/updates_browser.cjs

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Test shop, payments, providers and releases
        run: .venv/bin/python -m pytest -q
      - name: Check frontend syntax
        run: |
          node --check app/static/app.js
          node --check app/static/admin.js
      - name: Test admin and customer UI data handling
        run: node --test tests/test_*_ui.cjs
      - name: Check Python and shell syntax
        run: |
          .venv/bin/python -m compileall -q app agent scripts
          bash -n scripts/wireguard-init.sh
          bash -n install.sh

  docker-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout baseline v0.021
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v0.021
          path: baseline
          persist-credentials: false
      - name: Checkout intermediate v0.024
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v0.024
          path: intermediate
          persist-credentials: false
      - name: Real Docker upgrade and restore staging
        run: |
          sudo python3 candidate/tests/docker_staging.py --disposable --baseline "$GITHUB_WORKSPACE/baseline" --intermediate "$GITHUB_WORKSPACE/intermediate" --source "$GITHUB_WORKSPACE/candidate" --report "$RUNNER_TEMP/shop-docker-staging.json"

  wireguard-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Real WireGuard purchase and data-plane acceptance
        run: |
          sudo python3 tests/wireguard_staging.py --disposable --source "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/shop-wireguard-staging.json"

  installer-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout installer candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Real installer CLI on Ubuntu 24.04 with existing Docker
        run: |
          sudo python3 tests/installer_staging.py --disposable --source "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/shop-installer-staging.json"
