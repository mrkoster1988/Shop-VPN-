name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Test shop, payments, providers and releases
        run: .venv/bin/python -m pytest -q
      - name: Check frontend syntax
        run: |
          node --check app/static/app.js
          node --check app/static/admin.js
      - name: Test admin and customer UI data handling
        run: node --test tests/test_*_ui.cjs
      - name: Check Python and shell syntax
        run: |
          .venv/bin/python -m compileall -q app agent scripts
          bash -n scripts/wireguard-init.sh
          bash -n install.sh
