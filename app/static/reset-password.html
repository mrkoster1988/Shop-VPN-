<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="shop-base" content="__BASE_PATH__"><title>Смена пароля — Pushok VPN</title><link rel="stylesheet" href="__BASE_PATH__/static/style.css"></head>
<body><main class="wrap" style="max-width:560px;padding-top:10vh"><a href="__BASE_PATH__/" class="brand">✳ pushok.vpn</a><h1>Задайте новый пароль</h1><p>Ссылка одноразовая и действует 20 минут.</p><form id="reset-form"><label>Новый пароль<input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label>Повторите пароль<input name="repeat" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button>Сменить пароль</button></form><p id="reset-status" role="status"></p><a href="__BASE_PATH__/">Вернуться в магазин</a></main><script>
const base=document.querySelector('meta[name="shop-base"]').content;
const token=decodeURIComponent(location.hash.slice(1));
const form=document.getElementById('reset-form'),status=document.getElementById('reset-status');
if(!token){form.hidden=true;status.textContent='Ссылка отсутствует или уже использована.'}
form.onsubmit=async event=>{
 event.preventDefault();const values=new FormData(form),password=values.get('password');
 if(password!==values.get('repeat')){status.textContent='Пароли не совпадают.';return}
 const button=form.querySelector('button');button.disabled=true;status.textContent='Сохраняем новый пароль…';
 try{
  const response=await fetch(base+'/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:password})});
  const result=await response.json();if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:'Не удалось сменить пароль');
  history.replaceState(null,'',location.pathname);form.hidden=true;status.textContent=result.message;
 }catch(error){status.textContent=error.message}
 finally{button.disabled=false;form.reset()}
};
</script></body></html>
