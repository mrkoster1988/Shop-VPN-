# Вставьте эти location ВНУТРЬ существующего HTTPS server; замените example.com своим доменом.
# Сохраните сертификаты, корневой location и настройки других приложений.
# PUBLIC_URL=https://example.com/shop
location = /shop {
    return 308 /shop/$is_args$args;
}
# Одноразовые секреты входа не должны попадать в журнал запросов.
location = /shop/login {
    access_log off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Ссылки подписки дают доступ по секрету в URL. Отключите журнал запросов и здесь.
location ^~ /shop/sub/ {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /shop/ {
    client_max_body_size 16k;
    # Без завершающего слеша: передавайте /shop приложению без изменений.
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
