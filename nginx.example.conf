# Insert these locations INSIDE the existing HTTPS server for pushok.shop.
# Keep its certificates, root location, and other applications as configured.
# PUBLIC_URL=https://pushok.shop/shop
location = /shop {
    return 308 /shop/$is_args$args;
}
# Single-use login credentials must never appear in access logs.
location = /shop/login {
    access_log off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /shop/ {
    client_max_body_size 16k;
    # No trailing slash: forward /shop unchanged to the application.
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
