# Isolated Shop deployment beside MTProxy's existing Caddy.
# Run explicitly: docker compose -f compose.mtproxy-edge.yaml -p pushok-shop up -d --build
# Never combine with compose.yaml (host network / port 8000).
services:
  shop:
    build:
      context: .
    image: pushok-shop:mtproxy-edge
    container_name: pushok-shop
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      SHOP_PLATFORM_EDGE_PROXY: mtproxy-pushok-caddy-1
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
    networks:
      edge:
        aliases:
          - pushok-shop
    # No host ports: the existing Caddy will reach pushok-shop:8000 by Docker DNS.
    volumes:
      - shop_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/shop/health', timeout=5).close()"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 30s

networks:
  edge:
    external: true
    name: mtproxy-pushok_edge

volumes:
  shop_data:
    name: pushok_shop_data
